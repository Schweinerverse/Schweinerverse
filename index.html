<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>SITWS 5 - Eternal Snow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#eef3f8;--gold:#d8b56a;--hp:#b3392f;--st:#5f9a6b;--panel:rgba(14,20,30,.62);box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#c9d6e2;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
canvas{display:block}
#hud{position:fixed;left:0;top:0;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0}
.bar{width:280px;height:12px;background:var(--panel);border:1px solid rgba(216,181,106,.55);margin-bottom:6px}
.bar i{display:block;height:100%;width:100%}
#hp i{background:var(--hp)}#st i{background:var(--st);width:100%}
#area{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:8px}
#compass{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:260px;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;font-size:13px}
#ctrack{position:relative;height:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
#ctrack .c{position:absolute;left:50%;top:0;line-height:20px;color:var(--ink)}.c1{color:var(--gold);font-weight:bold;font-size:15px}.c2{font-size:11px}
#cval{color:var(--gold);font-size:11px;letter-spacing:.15em;border-top:1px solid rgba(216,181,106,.6);margin:0 70px;padding-top:2px}
#hits{font-size:13px;opacity:.85;margin-top:8px}
#help{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.6;background:var(--panel);padding:8px 12px;text-align:right}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,16,26,.55);cursor:pointer;text-align:center}
#title h1{font-size:clamp(34px,7vw,84px);font-weight:400;letter-spacing:.06em;margin:0;text-shadow:0 2px 18px #000}
#title p{margin:10px 0 0;font-size:clamp(14px,2vw,20px);color:var(--gold);font-style:italic}
#ebar{position:fixed;display:none;width:120px;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:12px;text-shadow:0 1px 4px #000}
#ebar div{height:7px;background:var(--panel);border:1px solid rgba(216,181,106,.55);margin-top:2px}#ebar i{display:block;height:100%;background:var(--hp)}
#lock{position:fixed;display:none;width:26px;height:26px;border:2px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 8px #000}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(160,20,20,.75))}
#msg{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(30px,6vw,72px);letter-spacing:.1em;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 2px 18px #000}
#tp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,16,26,.62);z-index:9}
.tpb{background:rgba(14,20,30,.92);border:1px solid rgba(216,181,106,.6);padding:22px 26px;min-width:290px;text-align:center}
.tpb h2{margin:0 0 14px;font-weight:400;letter-spacing:.12em;color:var(--gold)}.tpb small{font-size:12px;opacity:.7}
.tpb button{display:block;width:100%;margin:8px 0;padding:10px 14px;background:rgba(216,181,106,.08);border:1px solid rgba(216,181,106,.45);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.tpb button:hover{background:rgba(216,181,106,.22)}.tpb b{color:var(--gold);margin-right:10px}.tpb p{margin:12px 0 0;font-size:12px;opacity:.7}
</style></head><body>
<div id="compass"><div id="ctrack"></div><div id="cval"></div></div><div id="hud"><div class="bar" id="hp"><i></i></div><div class="bar" id="st"><i></i></div><div id="area">Frostfall Basin</div><div id="hits"></div></div>
<div id="help">WASD move &middot; Shift sprint &middot; Space roll<br>Left click / J light combo &middot; Right click / K heavy<br>Mouse or arrow keys: camera &middot; Wheel: zoom<br>Tab / Q / middle click: lock on</div><div id="ebar">Frost Knight<div><i></i></div></div><div id="lock"></div><div id="hurt"></div><div id="msg"></div>
<div id="title"><h1>SITWS 5</h1><p>Eternal Snow &mdash; click to begin</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="js/a_core.js"></script>
<script src="js/b_world.js"></script>
<script src="js/c_castle.js"></script>
<script src="js/c2_forest.js"></script>
<script src="js/d_snow_player.js"></script>
<script src="js/d2_town.js"></script>
<script src="js/d3_ironhold.js"></script>
<script src="js/e_enemy_combat.js"></script>
<script src="js/f_loop_input.js"></script>
</body></html>
