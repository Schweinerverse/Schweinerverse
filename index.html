<style>

#cval{color:var(--gold);font-size:11px;letter-spacing:.15em;border-top:1px solid rgba(216,181,106,.6);margin:0 70px;padding-top:2px}

#ebar{position:fixed;display:none;width:120px;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:12px;text-shadow:0 1px 4px #000}
#ebar div{height:7px;background:var(--panel);border:1px solid rgba(216,181,106,.55);margin-top:2px}#ebar i{display:block;height:100%;background:var(--hp)}
#lock{position:fixed;display:none;width:26px;height:26px;border:2px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 8px #000}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(160,20,20,.75))}
#msg{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(30px,6vw,72px);letter-spacing:.1em;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 2px 18px #000}
</style></head><body>
<div id="compass"><div id="ctrack"></div><div id="cval"></div></div><div id="hud"><div class="bar" id="hp"><i></i></div><div class="bar" id="st"><i></i></div><div id="area">Frostfall Basin</div><div id="hits"></div></div>

<div id="title"><h1>SITWS 5</h1><p>Eternal Snow &mdash; click to begin</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const T=THREE,PI=Math.PI,$=id=>document.getElementById(id);
const SUN=new T.Vector3(.62,.34,.42).normalize(),SV=SUN.toArray().map(x=>x.toFixed(4)).join(',');
{const F=T.ShaderChunk; // sun-scattered fog: tints distant haze toward the sun
 if(F.fog_pars_vertex.includes('varying float vFogDepth;')&&F.fog_vertex.includes('vFogDepth = - mvPosition.z;')&&F.fog_pars_fragment.includes('varying float vFogDepth;')&&F.fog_fragment.includes('fogDensity')){
 F.fog_pars_vertex=F.fog_pars_vertex.replace('varying float vFogDepth;','varying float vFogDepth;varying vec3 vFogDir;');
 F.fog_vertex=F.fog_vertex.replace('vFogDepth = - mvPosition.z;','vFogDepth = - mvPosition.z;vFogDir=(vec4(mvPosition.xyz,0.)*viewMatrix).xyz;');
 F.fog_pars_fragment=F.fog_pars_fragment.replace('varying float vFogDepth;','varying float vFogDepth;varying vec3 vFogDir;');
 F.fog_fragment=`#ifdef USE_FOG
 float fgd=fogDensity*exp(-max(cameraPosition.y+vFogDir.y,0.)*.011);float fogFactor=1.0-exp(-fgd*fgd*vFogDepth*vFogDepth);
 float sgl=pow(max(dot(normalize(vFogDir),vec3(${SV})),0.),5.);
 gl_FragColor.rgb=mix(gl_FragColor.rgb,mix(fogColor,vec3(1.,.84,.64),sgl*.6),fogFactor);
#endif`}}
const LIM=575,XMAX=2540,ZN=1440;
const H0=(x,z)=>{const f=Math.min(1,Math.max(0,(Math.hypot(x,z)-25)/60));return f*(Math.sin(x*.012)*Math.cos(z*.015)*7+Math.sin(x*.035+z*.022)*2.2+Math.sin(z*.06)*Math.sin(x*.05)*.8)};
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hsh=(x,z)=>{let h=Math.imul(x,374761393)+Math.imul(z,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const n2=(x,z)=>{const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz),a=hsh(ix,iz),b=hsh(ix+1,iz),c=hsh(ix,iz+1),d=hsh(ix+1,iz+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const rid=(x,z)=>{let a=.5,f=1,s=0,w=1;for(let i=0;i<5;i++){let n=1-Math.abs(n2(x*f,z*f)*2-1);n*=n;s+=n*a*w;w=Math.min(1,n*2);a*=.5;f*=2.1}return s};
// Eastern mountain province: ridged peaks with two winding passes (zc1 main, zc2 north-east branch)
const zc1=x=>-30+120*Math.sin((x-400)*.0035)+45*Math.sin(x*.011),zc2=x=>-30-(x-900)*.55;
const MTN=(x,z)=>{if(x<380)return 0;const d=Math.min(Math.abs(z-zc1(x)),x>880?Math.abs(z-zc2(x))*.9:1e9),m=sm(120,420,d),E=sm(380,1000,x);if(m*E<=0)return 0;
 return(rid(x*.0021,z*.0021)*(400+600*sm(500,1700,x))+60*n2(x*.01,z*.01))*m*E};
const H=(x,z)=>{const e=Math.min(3,Math.max(0,(-x-480)/100,(x-2450)/100,(z-480)/100,Math.max(0,(-z-480)/100)*(1-sm(900,1100,x)),(-z-1350)/100));
 return H0(x,z)+e*e*45*(1+.4*Math.sin(x*.045+z*.03)*Math.cos(z*.05))+MTN(x,z)};
const R=Math.random;
const scene=new T.Scene();scene.background=new T.Color(0xb9c6d3);scene.fog=new T.FogExp2(0xb9c6d3,.017);const uT={value:0};
const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.2,3500);
const ren=new T.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.05;document.body.appendChild(ren.domElement);
scene.add(new T.HemisphereLight(0xcfdcf0,0x7f92ab,.55));
const sun=new T.DirectionalLight(0xffe9cf,1.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:160});scene.add(sun,sun.target);
const rim=new T.DirectionalLight(0x86a6e8,.45);rim.position.set(-SUN.x*50,SUN.y*20+10,-SUN.z*50);scene.add(rim);
const elight=new T.PointLight(0xff3b2a,0,16,2);scene.add(elight);
const skyU={hz:{value:new T.Color(0xb9c6d3)},zn:{value:new T.Color(0x5b6f8c)},sd:{value:SUN},tm:uT};
const sky=new T.Mesh(new T.SphereGeometry(700,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:skyU,
 vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform vec3 hz,zn,sd;uniform float tm;varying vec3 vD;
 float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
 float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s;}
 void main(){vec3 d=normalize(vD);float h=clamp(d.y,0.,1.);vec3 c=mix(hz,zn,pow(h,.45));float mu=max(dot(d,sd),0.);
  vec2 cp=d.xz/(d.y+.18)*1.4+vec2(tm*.02,tm*.012);float cl=smoothstep(.35,.85,fbm(cp)+.2*fbm(cp*3.));cl*=smoothstep(-.05,.25,d.y);
  vec3 cc=mix(vec3(.62,.68,.76),vec3(.96,.95,.93),pow(mu,.5)*.8+h*.3);c=mix(c,cc,cl*.85);
  c+=vec3(1.,.8,.55)*(pow(mu,4.)*.22+pow(mu,64.)*.5*(1.-cl*.7));c=mix(c,hz,pow(1.-h,4.)*.6);gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-1;sky.frustumCulled=false;scene.add(sky);

// terrain
const tg=new T.PlaneGeometry(3400,2200,425,275);tg.rotateX(-PI/2);tg.translate(1000,0,-400);
const tp=tg.attributes.position;for(let i=0;i<tp.count;i++)tp.setY(i,H(tp.getX(i),tp.getZ(i)));
tg.computeVertexNormals();
const gm=new T.MeshStandardMaterial({color:0xeef3fa,roughness:.85});
const GN=`float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
float hh(vec2 p){return vn(p*.35)*.6+vn(p*1.3)*.25+sin((p.x*.8+p.y*.55)*2.5+vn(p*.2)*6.)*.12+vn(p*5.)*.08;}`;
gm.onBeforeCompile=sh=>{sh.uniforms.uT=uT;
 sh.vertexShader='varying vec3 vWP;varying vec3 vWN;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;vWN=normalize(mat3(modelMatrix)*normal);');
 sh.fragmentShader='uniform float uT;varying vec3 vWP;varying vec3 vWN;\n'+GN+sh.fragmentShader
  .replace('#include <color_fragment>',`#include <color_fragment>
  diffuseColor.rgb*=mix(vec3(.78,.87,.98),vec3(1.),smoothstep(.2,.8,vn(vWP.xz*.08)+vn(vWP.xz*.6)*.2));
  float rk=smoothstep(.14,.32,1.-vWN.y+vn(vWP.xz*.3)*.08)*smoothstep(3.,20.,vWP.y);rk*=1.-.5*smoothstep(250.,500.,vWP.y);diffuseColor.rgb=mix(diffuseColor.rgb,mix(vec3(.26,.28,.33),vec3(.5,.47,.45),vn(vec2(vWP.y*.04,vWP.x*.01+vWP.z*.01)))*(.8+.4*vn(vWP.xz*1.5)),rk);`)
  .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  float vd=distance(vWP,cameraPosition);float fd=1.-smoothstep(25.,110.,vd);if(fd>.01){vec2 wq=vWP.xz;float e0=.06,h0=hh(wq);
  vec3 gw=vec3(-(hh(wq+vec2(e0,0.))-h0)/e0,0.,-(hh(wq+vec2(0.,e0))-h0)/e0);
  normal=normalize(normal+(mat3(viewMatrix)*gw)*.45*fd);}`)
  .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
  float hsp=hs(floor(vWP.xz*45.));float sp=step(.982,hsp)*(.5+.5*sin(uT*2.5+hsp*60.))*(1.-smoothstep(10.,60.,vd));

  .replace('#include <lights_fragment_end>',`#include <lights_fragment_end>
  float ndlS=dot(normal,normalize((viewMatrix*vec4(vec3(${SV}),0.)).xyz));reflectedLight.indirectDiffuse+=diffuseColor.rgb*vec3(.32,.5,.85)*(1.-clamp(ndlS,0.,1.))*.22;
  float fres=pow(1.-clamp(dot(normal,normalize(vViewPosition)),0.,1.),4.);reflectedLight.indirectSpecular+=vec3(.7,.8,1.)*fres*.12;`)};
const ground=new T.Mesh(tg,gm);ground.receiveShadow=true;scene.add(ground);

// trees & rocks
const place=(mesh,n,fn)=>{const m=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler();
 for(let i=0;i<n;i++){let x,z;do{x=(R()-.5)*1300;z=(R()-.5)*1300}while(Math.hypot(x,z)<35);
  const s=fn(i);e.set(0,R()*6.28,0);q.setFromEuler(e);m.compose(new T.Vector3(x,H(x,z)+s.y,z),q,new T.Vector3(s.x,s.h,s.x));mesh.setMatrixAt(i,m)}
 scene.add(mesh)};
// spruce trees from Spruce1.glb (decimated), chunked instancing
const tm=new T.MeshStandardMaterial({color:0x3c5a4c,roughness:1,side:T.DoubleSide});
async function loadTree(){
 const ab=await (await fetch('tree.glb')).arrayBuffer(),dv=new DataView(ab),jl=dv.getUint32(12,true);
 const js=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jl))),bo=20+jl+8,bv=js.bufferViews,nv=js.accessors[1].count;
 const F=(i,C,n)=>new C(ab,bo+bv[i].byteOffset,n),g=new T.BufferGeometry();
 g.setAttribute('position',new T.BufferAttribute(F(1,Float32Array,nv*3),3));
 g.setAttribute('uv',new T.BufferAttribute(F(2,Float32Array,nv*2),2));
 g.setAttribute('normal',new T.BufferAttribute(F(3,Float32Array,nv*3),3));
 g.setIndex(new T.BufferAttribute(F(0,Uint16Array,js.accessors[0].count),1));
 const url=URL.createObjectURL(new Blob([new Uint8Array(ab,bo+bv[4].byteOffset,bv[4].byteLength)],{type:'image/jpeg'}));
 new T.TextureLoader().load(url,t=>{t.flipY=false;tm.map=t;tm.color.set(0xffffff);tm.needsUpdate=true});
 return g}
tm.onBeforeCompile=sh=>{sh.uniforms.uT=uT;
 sh.vertexShader='uniform float uT;varying float vTy;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
 vTy=transformed.y;float sw=max(transformed.y+.5,0.);sw*=sw;vec4 iw=instanceMatrix*vec4(transformed,1.);
 transformed.x+=sin(uT*1.5+iw.x*.25+iw.z*.2)*.02*sw;transformed.z+=cos(uT*1.2+iw.z*.25)*.012*sw;`);
 sh.fragmentShader='varying float vTy;\n'+sh.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
 vec3 wn=normalize((vec4(normal,0.)*viewMatrix).xyz);float sn=smoothstep(.15,.7,wn.y+(vTy+.5)*.25-.1);
 diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.93,.96,1.),sn*.75);`)
 .replace('#include <lights_fragment_end>',`#include <lights_fragment_end>
 float nd2=dot(normal,normalize((viewMatrix*vec4(vec3(${SV}),0.)).xyz));reflectedLight.indirectDiffuse+=diffuseColor.rgb*vec3(.9,1.,.85)*max(-nd2,0.)*.18;`)};
const CH=100,chunks=[],bk={};
for(let i=0;i<1600;i++){const x=(R()-.5)*1300,z=(R()-.5)*1300;if(Math.hypot(x,z)<35||Math.max(Math.abs(x),Math.abs(z))>520)continue;(bk[Math.floor(x/CH)+','+Math.floor(z/CH)]??=[]).push([x,z,9+R()*7,R()*6.28])}
for(let i=0;i<2600;i++){const x=470+R()*2000,z=-1300+R()*1800,y=H(x,z);if(y>50||Math.abs(H(x+5,z)-y)>3.5||Math.abs(H(x,z+5)-y)>3.5)continue;(bk[Math.floor(x/CH)+','+Math.floor(z/CH)]??=[]).push([x,z,9+R()*8,R()*6.28])}
function buildTrees(tgeo){const m4=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler();
for(const k in bk){const a=bk[k],im=new T.InstancedMesh(tgeo,tm,a.length);im.frustumCulled=false;
 a.forEach((t,i)=>{e.set(0,t[3],0);q.setFromEuler(e);m4.compose(new T.Vector3(t[0],H(t[0],t[1])+t[2]*.35,t[1]),q,new T.Vector3(t[2],t[2],t[2]));im.setMatrixAt(i,m4)});
 const [cx,cz]=k.split(',').map(Number);chunks.push({m:im,cx:(cx+.5)*CH,cz:(cz+.5)*CH});scene.add(im)}}
loadTree().catch(()=>{tm.color.set(0x2f4a3c);return new T.ConeGeometry(.3,1,7)}).then(buildTrees);
const cItems=[];
for(let d=0;d<360;d+=15){const e=document.createElement('span'),L={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'}[d];e.className='c'+(L?(L.length==1?' c1':' c2'):'');e.textContent=L||'\u00b7';$('ctrack').appendChild(e);cItems.push([e,d])}
function compassUpdate(){const h=(((PI-P.face)*180/PI)%360+360)%360;
 for(const [e,d] of cItems){const x=((d-h+540)%360)-180;e.style.transform='translateX(calc(-50% + '+x*2.4+'px))';e.style.opacity=Math.max(0,1-Math.abs(x)/62)}
 $('cval').textContent=['N','NE','E','SE','S','SW','W','NW'][Math.round(h/45)%8]+' '+Math.round(h)+'\u00b0'}
let areaN='Frostfall Basin';function areaUpdate(){const n=P.x<430?'Frostfall Basin':P.x<1100?'The Frostpass':'Spirefall Heights';if(n!=areaN){areaN=n;$('area').textContent=n;msg(n.toUpperCase(),2800)}}

place(new T.InstancedMesh(new T.IcosahedronGeometry(1,0),new T.MeshStandardMaterial({color:0x9aa3ad,roughness:1,flatShading:true}),200),200,()=>({x:1+R()*3,h:.6+R()*1.5,y:.1}));

// snowfall
const N=14000,sp=new Float32Array(N*3),sv=new Float32Array(N);
for(let i=0;i<N;i++){sp[i*3]=(R()-.5)*100;sp[i*3+1]=R()*55;sp[i*3+2]=(R()-.5)*100;sv[i]=2+R()*3}
const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(sp,3));
const snow=new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.26,transparent:true,opacity:.9,fog:false}));snow.frustumCulled=false;scene.add(snow);

// player rig (faces +z)
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.8});
const box=(w,h,d,c,x,y,z,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;p.add(m);return m};

// Tarnished-style wanderer: hooded, worn armor, frost-rimed, tattered cloak
const mt=(c,r,m)=>new T.MeshStandardMaterial({color:c,roughness:r??.9,metalness:m||0});
const MC=mt(0x2c333d),MA=mt(0x5b636e,.55,.55),MD=mt(0x2a2420,.95),ML=mt(0x3d3129,.9),MF=mt(0xd9d3c7,1),MS=mt(0xeaf2fa,1),MK=mt(0x38414e,1),MG=mt(0x9a8450,.5,.6);MK.side=T.DoubleSide;
const BX=(w,h,d)=>new T.BoxGeometry(w,h,d),SP=new T.SphereGeometry(1,12,9),CY=(a,b,h)=>new T.CylinderGeometry(a,b,h,10);

let comp=null,gr=null;
if(T.EffectComposer&&T.UnrealBloomPass&&T.ShaderPass&&T.RenderPass){try{
 comp=new T.EffectComposer(ren);comp.addPass(new T.RenderPass(scene,cam));
 comp.addPass(new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.5,.6,1.2));
 gr=new T.ShaderPass({uniforms:{tDiffuse:{value:null},t:{value:0},dark:{value:0}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float t,dark;varying vec2 v;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}void main(){vec2 c=v-.5;float d=dot(c,c);vec3 col=vec3(texture2D(tDiffuse,v+c*d*.014).r,texture2D(tDiffuse,v).g,texture2D(tDiffuse,v-c*d*.014).b);col=aces(col*1.15);float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,.9-dark*.7);col=mix(col*vec3(.93,.98,1.06),col*vec3(1.05,1.,.94),smoothstep(.25,.9,l)*.5);col*=1.-d*1.2;col*=1.-dark*.35;col+=(h(v*vec2(1920.,1080.)+t)-.5)*.03;gl_FragColor=vec4(col,1.);}'});
 comp.addPass(gr);ren.toneMapping=T.NoToneMapping;
}catch(e){comp=null;gr=null;console.warn('postfx off',e)}}
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;if(stop>0){stop-=dt;dt=0}update(dt);if(comp){gr.uniforms.t.value=(now*.001)%10;gr.uniforms.dark.value=(1-P.hp/100)*.85;comp.render()}else ren.render(scene,cam)})(last);

// input
addEventListener('keydown',e=>{if(P.dead){if(e.code=='KeyR')respawn();return}keys[e.code]=true;
 if(e.code=='Space'){e.preventDefault();const mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);let dx=fx*mz-fz*mx,dz=fz*mz+fx*mx;const l=Math.hypot(dx,dz);dodge(l?dx/l:0,l?dz/l:0,l)}
 if(e.code=='Tab'||e.code=='KeyQ'){e.preventDefault();toggleLock()}if(e.code=='KeyJ')attack('L');if(e.code=='KeyK')attack('H')});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement){if(!P.lock)yaw-=e.movementX*.003;pitch=Math.max(-.15,Math.min(1.2,pitch+e.movementY*.003))}});
addEventListener('wheel',e=>{dist=Math.max(3,Math.min(14,dist+e.deltaY*.005))});
addEventListener('contextmenu',e=>e.preventDefault());
ren.domElement.addEventListener('mousedown',e=>{if(!started)return;if(e.button==1){e.preventDefault();toggleLock();return}attack(e.button==2?'H':'L')});
$('title').addEventListener('click',()=>{started=true;$('title').style.display='none';msg('FROSTFALL BASIN',3200);try{ren.domElement.requestPointerLock()}catch(_){}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);if(comp)comp.setSize(innerWidth,innerHeight)});
</script></body></html>
